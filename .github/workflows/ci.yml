name: CI

on:
  push:
    branches:
      - master
      - main
  pull_request:

jobs:
  static-checks:
    name: Static checks
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Compile Python sources
        run: python -m py_compile enhanced_kinklist.py db.py db_postgres.py compile_stats.py wsgi.py tools/*.py

      - name: Validate catalog JSON
        run: |
          python -m json.tool enhanced_kinklist.json > /tmp/enhanced_kinklist_json_check
          python -m json.tool catalog_snapshots/main-2026.1.json > /tmp/catalog_snapshot_json_check
          python tools/validate_catalog_metadata.py --config enhanced_kinklist.json --metadata catalog_metadata/main.csv

      - name: Check JavaScript syntax
        run: |
          node --check static/build_list.js
          node --check static/mobile.js
          node --check static/buildCharts.js
          node --check static/home_stats.js
          node --check static/export_results.js

  docker-build:
    name: Docker build
    needs: [static-checks]
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Log in to GHCR
        if: github.event_name == 'push'
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build image
        run: |
          docker build --pull \
            -t ghcr.io/paulhaeussler/enhanced-kinklist:${{ github.sha }} \
            -t ghcr.io/paulhaeussler/enhanced-kinklist:master \
            .

      - name: Push image
        if: github.event_name == 'push'
        run: |
          docker push ghcr.io/paulhaeussler/enhanced-kinklist:${{ github.sha }}
          docker push ghcr.io/paulhaeussler/enhanced-kinklist:master
